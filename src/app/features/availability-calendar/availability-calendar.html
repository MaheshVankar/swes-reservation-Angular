<div
  class="d-grid gap-2"
  style="grid-template-columns: repeat(7, 1fr); display: grid;"
>
  <button
    type="button"
    *ngFor="let day of days"
    class="btn btn-sm calendar-day"
    [ngClass]="day.available ? 'btn-success' : 'btn-secondary'"
    [disabled]="!day.available"
    (click)="onDateClick(day.date, day.available)"
  >
    {{ day.day }}
  </button>
</div>
